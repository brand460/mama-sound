<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Für Mama ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #fdfbf7;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #333;
        }
        .card {
            text-align: center;
            padding: 2rem;
        }
        .heart {
            font-size: 4rem;
            animation: pulse 1.5s infinite;
            margin-bottom: 1rem;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
            color: #555;
        }
        audio {
            width: 100%;
            max-width: 280px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="heart">❤️</div>
        <h1>Hör mal, Mama!</h1>
        
        <!-- Der Audio-Player mit der exakten Datei -->
        <audio autoplay controls>
            <source src="sound.mp3" type="audio/mpeg">
            Dein Browser unterstützt kein Audio.
        </audio>
    </div>

</body>
</html>
