<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Für Mama ❤️</title>
<style>
  body {
    margin: 0;
    background: #fdfbf7;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #333;
    text-align: center;
  }
  .heart { font-size: 5rem; animation: pulse 1.5s infinite; cursor: pointer; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }
  h1 { font-size: 1.5rem; font-weight: 500; color: #555; }
  #hint { font-size: 1rem; color: #999; display: none; }
</style>
</head>
<body>
  <div class="heart" id="heart">❤️</div>
  <h1>Hör mal, Mama!</h1>
  <div id="hint">Tippe aufs Herz ❤️</div>

  <audio id="a" src="sound.mp3" preload="auto" playsinline></audio>

<script>
  const a = document.getElementById('a');
  const hint = document.getElementById('hint');

  function start() {
    a.play().then(() => {
      document.removeEventListener('click', start);
      document.removeEventListener('touchstart', start);
      hint.style.display = 'none';
    }).catch(() => {
      hint.style.display = 'block';
    });
  }

  // 1. Automatisch versuchen
  start();
  // 2. Fallback: erster Tipp irgendwo startet den Ton
  document.addEventListener('click', start);
  document.addEventListener('touchstart', start);
</script>
</body>
</html>
